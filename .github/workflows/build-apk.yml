name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Ubah dua baris ini untuk akun kedua (misalnya com.yusuf.claudeakun2 dan Claude Akun 2)
env:
  APP_ID: com.yusuf.claudeakun1
  APP_NAME: Claude Red

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Buat file proyek dan ikon
        run: |
          mkdir -p app/www app/assets
          cd app

          cat > package.json <<'EOF'
          {
            "name": "claude-wrapper",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/core": "^6.1.0"
            }
          }
          EOF

          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "https://claude.ai",
              "cleartext": false,
              "allowNavigation": [
                "claude.ai",
                "*.claude.ai",
                "*.anthropic.com",
                "accounts.google.com",
                "appleid.apple.com"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Claude</title>
          </head>
          <body>
            <p>Membuka claude.ai... Pastikan internet aktif, lalu buka ulang aplikasi.</p>
          </body>
          </html>
          EOF

          base64 -d > assets/mask.png <<'B64'
