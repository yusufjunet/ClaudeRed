name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Ubah dua baris ini untuk akun kedua
env:
  APP_ID: com.yusuf.claudeakun1
  APP_NAME: Claude Red

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Buat proyek
        run: |
          mkdir -p app/www
          cd app
          echo '{"name":"claude-wrapper","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"}}' > package.json
          echo "{\"appId\":\"$APP_ID\",\"appName\":\"$APP_NAME\",\"webDir\":\"www\",\"server\":{\"url\":\"https://claude.ai\",\"cleartext\":false,\"allowNavigation\":[\"claude.ai\",\"*.claude.ai\",\"*.anthropic.com\",\"accounts.google.com\",\"appleid.apple.com\"]},\"android\":{\"allowMixedContent\":false}}" > capacitor.config.json
          echo '<!doctype html><html><head><meta charset="utf-8"><title>Claude</title></head><body>Membuka claude.ai...</body></html>' > www/index.html

      - name: Siapkan Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Pasang ikon
        working-directory: app
        run: |
          if [ ! -f ../icon-only.png ]; then
            echo "::warning::icon-only.png tidak ada di folder utama repo, ikon bawaan dipakai"
            exit 0
          fi
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          src = Image.open("../icon-only.png").convert("RGB")
          sizes = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          for d, (leg, fg) in sizes.items():
              p = f"android/app/src/main/res/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              sq = src.resize((leg, leg), Image.LANCZOS)
              sq.save(f"{p}/ic_launcher.png")
              m = Image.new("L", (leg * 4, leg * 4), 0)
              ImageDraw.Draw(m).ellipse((0, 0, leg * 4 - 1, leg * 4 - 1), fill=255)
              m = m.resize((leg, leg), Image.LANCZOS)
              r = Image.new("RGBA", (leg, leg), (0, 0, 0, 0))
              r.paste(sq, (0, 0), m)
              r.save(f"{p}/ic_launcher_round.png")
              src.resize((fg, fg), Image.LANCZOS).save(f"{p}/ic_launcher_foreground.png")
          print("ikon terpasang")
          PY

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: claude-red-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
